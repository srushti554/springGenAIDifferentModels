spring.application.name=springGenAItutorial 
server.port=8081

spring.ai.openai.api-key=${OPEN_AI_KEY}
spring.ai.openai.chat.options.model=gpt-4o

logging.level.root=INFO
logging.level.com.genai.java.spring=INFO
logging.level.springframework.ai=INFO

app.ai.provider=ollama
#The below project ID should be taken from the google json key file whose path you have set in env variables
spring.ai.vertex.ai.gemini.project-id=project-826395bc-476f-42d0-aef
spring.ai.vertex.ai.gemini.location=us-central1
spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.5-flash

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=mistral:latest
spring.ai.ollama.chat.options.max-new-token=512
spring.ai.ollama.chat.options.temperature=0.7